# --------------------------------------------------------
# SIGN SERVER CERT WITH CA
# --------------------------------------------------------
- name: Generate CA-signed server certificate
  become: true
  community.crypto.x509_certificate:
    path: "{{ cert_certificate_path }}"
    csr_path: "{{ cert_csr_path }}"
    provider: ownca
    ownca_path: "{{ cert_ca_certificate_path }}"
    ownca_privatekey_path: "{{ cert_ca_key_path }}"
    ownca_not_before: "-5m"
    ownca_not_after: "+{{ cert_validity_days }}d"
    ownca_digest: sha256
    ownca_create_subject_key_identifier: create_if_not_provided
    ownca_create_authority_key_identifier: true
    ownca_privatekey_passphrase: "{{ cert_ca_passphrase }}"
    owner: root
    group: root
    mode: "0644"

- name: Extract slot ID for token label
  ansible.builtin.set_fact:
    cert_ca_certificate_path: "{{ cert_ca_certificate_path }}"
    cert_key_path: "{{ cert_key_path }}"
    cert_certificate_path: "{{ cert_certificate_path }}"
