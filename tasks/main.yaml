---
- name: Install OpenSSL and cryptography runtime
  ansible.builtin.package:
    name: python3-cryptography
    state: present
  become: true

# --------------------------------------------------------
# CA GENERATION
# --------------------------------------------------------

- name: Create or retain local CA
  ansible.builtin.import_tasks: ca.yaml
  #when: cert_ca_create | bool

# --------------------------------------------------------
# SERVER KEY + CSR
# --------------------------------------------------------
- name: Ensure certificate directories exist
  ansible.builtin.file:
    path: "{{ cert_dir }}"
    state: directory
    mode: "0755"

- name: Generate client private key
  become: true
  community.crypto.openssl_privatekey:
    path: "{{ cert_key_path }}"
    size: 3072
    type: RSA
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: Generate OpenSSL CSR configuration
  become: true
  ansible.builtin.template:
    src: openssl.cnf.j2
    dest: "{{ cert_dir }}/openssl.cnf"
    owner: root
    group: root
    mode: "0644"

- name: Generate CSR using OpenSSL configuration
  become: true
  ansible.builtin.command: >
    openssl req -new -sha256 -key "{{ cert_key_path }}"
    -out "{{ cert_csr_path }}" -config "{{ cert_dir }}/openssl.cnf"
  args:
    creates: "{{ cert_csr_path }}"

