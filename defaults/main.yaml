---
cert_ca_dir: /etc/pki/certificate-generator/ca
cert_ca_key_path: "{{ cert_ca_dir }}/private/ca.key"
cert_ca_csr_path: "{{ cert_ca_dir }}/private/ca.csr"
cert_ca_certificate_path: "{{ cert_ca_dir }}/certs/ca.crt"

cert_ca_passphrase: "" # REQUIRED: provide through Ansible Vault (minimum 16 chars)
cert_ca_common_name: "Certificate Generator Local Root CA"
cert_ca_validity_days: 3650

# Certificate storage
cert_common_name: "{{ inventory_hostname }}"
cert_dir: /etc/pki/tls/{{ cert_common_name }}

cert_key_path: "{{ cert_dir }}/client.key"
cert_csr_path: "{{ cert_dir }}/client.csr"
cert_certificate_path: "{{ cert_dir }}/client.crt"

cert_validity_days: 365
